<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beat Preview | Heard Music</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      background: #111;
      border-bottom: 1px solid #222;
    }

    .brand {
      color: #d4af37;
      font-size: 22px;
      font-weight: bold;
    }

    .back-link {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .preview-wrap {
      max-width: 1100px;
      margin: 50px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: start;
    }

    .preview-art {
      width: 100%;
      border-radius: 14px;
      background: #181818;
    }

    .preview-info h1 {
      font-size: 42px;
      margin: 0 0 15px;
    }

    .genre {
      color: #d4af37;
      font-weight: bold;
      margin-bottom: 20px;
      text-transform: capitalize;
    }

    .description {
      color: #ccc;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    audio {
      width: 100%;
      margin-bottom: 25px;
    }

    .license-btn {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      background: #d4af37;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .preview-wrap {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">HEARD MUSIC</div>
  <a class="back-link" href="/#beatsContainer">← Back to Beat Store</a>
</header>

<main class="preview-wrap">
  <div>
    <img id="beatImage" class="preview-art" src="" alt="Beat artwork">
  </div>

  <div class="preview-info">
    <h1 id="beatTitle">Loading Beat...</h1>
    <div id="beatGenre" class="genre"></div>
    <p id="beatDescription" class="description"></p>

    <audio id="beatPlayer" controls></audio>

    <button id="mp3Btn" class="license-btn"></button>
    <button id="wavBtn" class="license-btn"></button>
    <button id="trackoutBtn" class="license-btn"></button>
    <button id="exclusiveBtn" class="license-btn">Exclusive - Enquire</button>
  </div>
</main>
  <footer style="
  text-align:center;
  padding:30px 20px;
  margin-top:50px;
  border-top:1px solid #222;
  color:#777;
">

  <div style="
    font-weight:bold;
    color:#d4af37;
    font-size:16px;
  ">
    HEARD MUSIC
  </div>

  <div style="margin-top:8px;color:white;">
    YOU CAN SAY YOU HEARD
  </div>

  <div style="
    margin-top:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  ">

    <!-- Instagram -->
    <a href="https://www.instagram.com/heardmusicproductions/"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Instagram"
       title="Instagram"
       style="color:#d4af37;text-decoration:none;">
      <svg width="24" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle cx="17.5" cy="6.5" r="1"
                fill="currentColor" stroke="none"></circle>
      </svg>
    </a>

    <!-- TikTok -->
    <a href="https://www.tiktok.com/@heard.musicycsyh"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="TikTok"
       title="TikTok"
       style="color:#d4af37;text-decoration:none;">
      <svg width="24" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 4v10.5a4.5 4.5 0 1 1-4-4.47"></path>
        <path d="M14 4c1.2 2.5 3.1 4 6 4"></path>
      </svg>
    </a>

    <!-- Spotify -->
    <a href="https://open.spotify.com/artist/312zbSpYcwdGgynUVQyodc"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Spotify"
       title="Spotify"
       style="color:#d4af37;text-decoration:none;">
      <svg width="24" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M7 9.5c3.8-1 7.7-.7 11 .9"></path>
        <path d="M7.8 13c3-.8 6.3-.5 9 .8"></path>
        <path d="M8.5 16.2c2.4-.6 4.8-.4 7 .6"></path>
      </svg>
    </a>

    <!-- YouTube Main -->
    <a href="https://youtube.com/@heardmusicycsyh"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="YouTube channel"
       title="YouTube"
       style="color:#d4af37;text-decoration:none;">
      <svg width="27" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="6" width="18" height="12" rx="4"></rect>
        <path d="M10 9l5 3-5 3z" fill="currentColor"></path>
      </svg>
    </a>

    <!-- YouTube Releases -->
     <a href="https://youtube.com/channel/UCjLSWC-rOKk-Sn2G5IKqxjQ?si=GomuYShdEkPudm3J
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Second YouTube channel"
       title="YouTube Releases"
       style="color:#d4af37;text-decoration:none;">
      <svg width="27" height="24" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="6" width="18" height="12" rx="4"></rect>
        <path d="M10 9l5 3-5 3z" fill="currentColor"></path>
      </svg>
    </a>

  </div>

  <div style="margin-top:12px;font-size:12px;">
    © 2026 Heard Music. All rights reserved.
  </div>

</footer>
<script>
  const beat = JSON.parse(localStorage.getItem("selectedBeat"));

  if (beat) {
    document.getElementById("beatTitle").textContent = beat.title || "Beat Preview";
    document.getElementById("beatGenre").textContent = beat.category || "";
   document.getElementById("beatDescription").textContent = beat.longDescription || beat.description || "";

    document.getElementById("beatImage").src = beat.image || "";

    const player = document.getElementById("beatPlayer");
    player.src = beat.mp3Url || beat.mp3 || "";
    player.addEventListener("timeupdate", () => {
  if (player.currentTime >= 30) {
    player.pause();
    player.currentTime = 0;
  }
});
    const mp3Price = beat.mp3Price ?? 45;
    const wavPrice = beat.wavPrice ?? 60;
    const trackoutPrice = beat.trackoutPrice ?? 300;

    document.getElementById("mp3Btn").textContent = `MP3 - £${mp3Price}`;
    document.getElementById("wavBtn").textContent = `WAV - £${wavPrice}`;
    document.getElementById("trackoutBtn").textContent = `Trackout - £${trackoutPrice}`;
    function addPreviewToCart(price, license, downloadUrl) {
  const cart = JSON.parse(localStorage.getItem("heardCart")) || [];

  cart.push({
    name: beat.title,
    price: price,
    license: license,
    downloadUrl: downloadUrl
  });

  localStorage.setItem("heardCart", JSON.stringify(cart));
const notice = document.createElement("div");
notice.textContent = "✓ Added to basket";
notice.style.position = "fixed";
notice.style.top = "20px";
notice.style.left = "50%";
notice.style.transform = "translateX(-50%)";
notice.style.background = "#d4af37";
notice.style.color = "#000";
notice.style.padding = "12px 18px";
notice.style.borderRadius = "8px";
notice.style.fontWeight = "bold";
notice.style.zIndex = "9999";

document.body.appendChild(notice);

setTimeout(() => {
  notice.remove();
}, 1500);
}

document.getElementById("mp3Btn").onclick = () => {
  addPreviewToCart(
    mp3Price,
    "MP3 Lease",
    beat.mp3Url || beat.mp3
  );
};

document.getElementById("wavBtn").onclick = () => {
  addPreviewToCart(
    wavPrice,
    "WAV Lease",
    beat.wavUrl || beat.wav
  );
};

document.getElementById("trackoutBtn").onclick = () => {
  addPreviewToCart(
    trackoutPrice,
    "Trackout Lease",
    beat.trackoutUrl || beat.zip
  );
};
    document.getElementById("exclusiveBtn").onclick = () => {
      window.location.href =
        `mailto:heardmusicproductions@gmail.com?subject=Exclusive Licence Enquiry - ${encodeURIComponent(beat.title)}`;
    };
  } else {
    document.getElementById("beatTitle").textContent = "Beat not found";
    document.getElementById("beatDescription").textContent =
      "Return to the Beat Store and choose a beat.";
  }
</script>
</body>
</html>
