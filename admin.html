<!DOCTYPE html>
<html>
<head>
  <title>Heard Music Admin</title>
</head>
<body>
 <script>
(async () => {
  const password = prompt("Enter admin password:");

  if (!password) {
    window.location.href = "/";
    return;
  }

  try {
    const response = await fetch("/api/admin-login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password })
    });

    if (!response.ok) {
      alert("Access denied");
      window.location.href = "/";
      return;
    }
  } catch (error) {
    alert("Login error");
    window.location.href = "/";
  }
})();
</script>
  <h1>Heard Music Admin</h1>

  <form id="beatForm">
    <input name="title" placeholder="Beat Title" required><br><br>
    <input name="category" placeholder="Genre / Category" required><br><br>
    <input name="mood" placeholder="Mood"><br><br>
    <input name="bpm" placeholder="BPM"><br><br>
    <input name="key" placeholder="Key"><br><br>

    <input name="mp3Price" placeholder="MP3 Price" value="45"><br><br>
    <input name="wavPrice" placeholder="WAV Price" value="65"><br><br>
    <input name="trackoutPrice" placeholder="Trackout Price" value="300"><br><br>

<label>Cover Image</label><br>
<input type="file" id="imageFile" accept="image/*"><br>
<div id="imageStatus"></div>
<button type="button" onclick="removeExistingFile('image', 'imageStatus', 'imageFile')">
  Remove
</button>
<input type="hidden" name="image"><br>

<label>Preview Audio</label><br>
<input type="file" id="previewFile" accept="audio/*"><br>
<div id="previewStatus"></div> 
 <button type="button" onclick="removeExistingFile('previewUrl', 'previewStatus', 'previewFile')">
  Remove
</button>   
<input type="hidden" name="previewUrl"><br>

<label>MP3 File</label><br>
<input type="file" id="mp3File" accept=".mp3,audio/mpeg"><br>
<div id="mp3Status"></div>  
<button type="button" onclick="removeExistingFile('mp3Url', 'mp3Status', 'mp3File')">
  Remove
</button>   
<input type="hidden" name="mp3Url"><br>

<label>WAV File</label><br>
<input type="file" id="wavFile" accept=".wav,audio/wav"><br>
<div id="wavStatus"></div>
<button type="button" onclick="removeExistingFile('wavUrl', 'wavStatus', 'wavFile')">
  Remove
</button>    
<input type="hidden" name="wavUrl"><br>

<label>Trackout ZIP</label><br>
<input type="file" id="trackoutFile" accept=".zip,application/zip"><br>
<div id="trackoutStatus"></div> 
<button type="button" onclick="removeExistingFile('trackoutUrl', 'trackoutStatus', 'trackoutFile')">
  Remove
</button>    
<input type="hidden" name="trackoutUrl"><br>

    <textarea name="description" placeholder="Description"></textarea><br><br>

    <button type="submit">Create Beat</button>
  </form>
    <hr>

<h2>Manage Beats</h2>
<div id="beatsList">Loading beats...</div>
  <script>
  const uploadthingClientPromise =
  import("https://esm.sh/uploadthing/client");

async function uploadFile(inputId, routeName, hiddenName) {
  const input = document.getElementById(inputId);

  if (!input || !input.files || input.files.length === 0) {
    return;
  }

  const { genUploader } = await uploadthingClientPromise;

  const { uploadFiles } = genUploader({
    url: new URL("/api/upload", window.location.origin),
    package: "vanilla"
  });

  const result = await uploadFiles(routeName, {
    files: [input.files[0]]
  });
console.log("UPLOAD RESULT:", routeName, result);
if (!result || !result[0] || !result[0].key) {
  throw new Error("Upload failed");
}

const fileUrl = `https://utfs.io/f/${result[0].key}`;

document.querySelector(
  `input[name="${hiddenName}"]`
).value = fileUrl;
}
    let editingBeatId = null;
    document.getElementById("beatForm").addEventListener("submit", async function(e) {
      e.preventDefault();
await Promise.all([
  uploadFile("imageFile", "coverImage", "image"),
  uploadFile("previewFile", "beatFile", "previewUrl"),
  uploadFile("mp3File", "beatFile", "mp3Url"),
  uploadFile("wavFile", "beatFile", "wavUrl"),
  uploadFile("trackoutFile", "beatFile", "trackoutUrl")
]);
      const form = new FormData(e.target);
      const beatData = Object.fromEntries(form.entries());

      beatData.mp3Price = Number(beatData.mp3Price);
      beatData.wavPrice = Number(beatData.wavPrice);
      beatData.trackoutPrice = Number(beatData.trackoutPrice);
      beatData.published = true;
      beatData.sold = false;

     if (editingBeatId) {
  beatData.id = editingBeatId;
}

const res = await fetch("/api/beats", {
  method: editingBeatId ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(beatData)
      });

      const data = await res.json();
console.log("SAVE RESPONSE:", data);
      if (!res.ok) {
        alert("Error: " + data.error);
        return;
      }

      const notice = document.createElement("div");
notice.textContent = editingBeatId ? "✓ Beat updated" : "✓ Beat saved";
notice.style.position = "fixed";
notice.style.top = "20px";
notice.style.left = "50%";
notice.style.transform = "translateX(-50%)";
notice.style.background = "#d4af37";
notice.style.color = "#000";
notice.style.padding = "12px 18px";
notice.style.borderRadius = "8px";
notice.style.fontWeight = "bold";
notice.style.zIndex = "9999";

document.body.appendChild(notice);

setTimeout(() => {
  notice.remove();
}, 1500);
      e.target.reset();
      await loadBeats();
      editingBeatId = null;
document.querySelector('button[type="submit"]').textContent = "Create Beat";
    });
async function loadBeats() {const res = await fetch("/api/beats?t=" + Date.now(), {
  cache: "no-store"
});
  const data = await res.json();

  const beatsList = document.getElementById("beatsList");

  if (!data.beats || data.beats.length === 0) {
    beatsList.innerHTML = "<p>No beats found.</p>";
    return;
  }

  beatsList.innerHTML = data.beats.map(beat => `
    <div style="border:1px solid #ccc; padding:12px; margin:10px 0;">
      <strong>${beat.title || "Untitled Beat"}</strong><br>
      Genre: ${beat.category || "N/A"}<br>
      Mood: ${beat.mood || "N/A"}<br>
      BPM: ${beat.bpm || "N/A"}<br>
      Key: ${beat.key || "N/A"}<br><br>

<button onclick="editBeat(JSON.parse(decodeURIComponent('${encodeURIComponent(JSON.stringify(beat)).replace(/'/g, "%27")}')))">Edit</button>
<button onclick="deleteBeat('${beat._id}')">Delete</button>
    </div>
  `).join("");
}
 function removeExistingFile(hiddenName, statusId, fileInputId) {
  const hiddenInput = document.querySelector(`input[name="${hiddenName}"]`);
  const status = document.getElementById(statusId);
  const fileInput = document.getElementById(fileInputId);

  hiddenInput.value = "";
  fileInput.value = "";
  status.textContent = "File marked for removal";
}   
function editBeat(beat) {
  editingBeatId = beat._id;

  const form = document.getElementById("beatForm");

  form.title.value = beat.title || "";
  form.category.value = beat.category || "";
  form.mood.value = beat.mood || "";
  form.bpm.value = beat.bpm || "";
  form.key.value = beat.key || "";

  form.mp3Price.value = beat.mp3Price || 45;
  form.wavPrice.value = beat.wavPrice || 65;
  form.trackoutPrice.value = beat.trackoutPrice || 300;

  form.image.value = beat.image || "";
  form.previewUrl.value = beat.previewUrl || "";
  form.mp3Url.value = beat.mp3Url || "";
  form.wavUrl.value = beat.wavUrl || "";
  form.trackoutUrl.value = beat.trackoutUrl || "";
  form.description.value = beat.description || "";
  document.getElementById("imageStatus").textContent =
  beat.image ? "✓ Existing cover attached" : "No cover attached";

document.getElementById("previewStatus").textContent =
  beat.previewUrl ? "✓ Existing preview attached" : "No preview attached";

document.getElementById("mp3Status").textContent =
  beat.mp3Url ? "✓ Existing MP3 attached" : "No MP3 attached";

document.getElementById("wavStatus").textContent =
  beat.wavUrl ? "✓ Existing WAV attached" : "No WAV attached";

document.getElementById("trackoutStatus").textContent =
  beat.trackoutUrl ? "✓ Existing Trackout attached" : "No Trackout attached";
  document.querySelector("button[type='submit']").textContent = "Update Beat";
  window.scrollTo(0, 0);
}
async function deleteBeat(id) {
  if (!confirm("Delete this beat?")) return;

  const res = await fetch("/api/beats", {
    method: "DELETE",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ id })
  });

  const data = await res.json();

  if (!res.ok) {
    alert("Error deleting beat: " + data.error);
    return;
  }

alert(editingBeatId ? "Beat updated!" : "Beat saved!");
editingBeatId = null;
e.target.reset();
document.querySelector("button[type='submit']").textContent = "Create Beat";
await loadBeats();
}

loadBeats();
  </script>
</body>
</html>
